<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 与预览完全一致的面板样式，仅尺寸换成 Unity 侧的实际尺寸 */
  html,body{margin:0;padding:0;background:#0E0A08;}
  .wrap{position:relative;width:2100px;height:1100px;}
  .panel{
    position:absolute;
    background:rgba(22,17,14,.97);
    border:4px solid #0B0908;
    box-shadow:
      inset 0 4px 0 rgba(255,236,200,.13),
      inset 4px 0 0 rgba(255,236,200,.06),
      inset 0 -4px 0 rgba(0,0,0,.55),
      inset -4px 0 0 rgba(0,0,0,.35);
    box-sizing:border-box;
  }
  .panel::before,.panel::after{
    content:"";position:absolute;width:10px;height:10px;
    background:#726151;
    border:2px solid #0B0908;
    box-shadow:inset 2px 2px 0 rgba(255,240,210,.35);
  }
  .panel::before{left:8px;top:8px}
  .panel::after{right:8px;bottom:8px}
  .tex{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,rgba(0,0,0,0) 2px 6px);
    opacity:.5;
  }
  #left{left:100px;top:100px;width:700px;height:838px;}
  #right{left:850px;top:100px;width:1100px;height:838px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel" id="left"><span class="tex"></span></div>
  <div class="panel" id="right"><span class="tex"></span></div>
</div>
</body>
</html>
