*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#060505;font-family:'ArkPixelPx','SimHei',sans-serif;color:#e9dcc0;user-select:none}

:root{
  --ink:#0b0908;
  --steel-1:#191412; --steel-2:#2b2320; --steel-3:#3f342c;
  --steel-4:#574a3f; --steel-5:#726151; --steel-6:#8d7a66;
  --bone:#e9dcc0; --bone-dim:#ab9b80; --bone-dark:#776853;
  --amber:#f0a050; --amber-dim:#a56328;
  --toxic:#a8ee54; --toxic-dim:#6f9c2b;
  --blood:#c04a38; --phosphor:#6adfa6;
  --scroll:#0a1310;
}

#viewport{position:fixed;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(1400px 700px at 50% 45%,#14100d 0%,#060505 78%)}
#stage{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;background:#0e0a08;transform-origin:center center}

/* ── 地图背景 ── */
.bgmap{position:absolute;inset:0;
  background:url("../Assets/Art/PixelWasteland/BG/codex_bg.png") center/cover no-repeat;
  image-rendering:pixelated;
  filter:saturate(.85) brightness(.85)}
.bgmap::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,8,7,.62) 0%,rgba(10,8,7,.18) 38%,rgba(10,8,7,.30) 72%,rgba(10,8,7,.86) 100%)}

/* ── 顶栏 ── */
.hdr{position:relative;height:92px;display:flex;align-items:center;gap:20px;padding:0 40px;
  background:linear-gradient(180deg,rgba(8,6,5,.62),rgba(8,6,5,.12) 58%,rgba(8,6,5,.42));
  border-bottom:2px solid rgba(11,9,8,.85)}
.btn{font:inherit;font-size:24px;letter-spacing:2px;color:var(--bone);cursor:pointer;
  background:var(--steel-2);border:4px solid var(--ink);padding:10px 22px;
  box-shadow:inset 2px 2px 0 rgba(255,236,200,.14),inset -2px -2px 0 rgba(0,0,0,.55),4px 4px 0 rgba(0,0,0,.45);
  display:inline-flex;align-items:center;gap:10px}
.btn:hover{background:var(--steel-3);color:#fff;box-shadow:inset 2px 2px 0 rgba(255,236,200,.14),inset -2px -2px 0 rgba(0,0,0,.55),4px 4px 0 rgba(0,0,0,.45),0 0 0 2px var(--amber-dim)}
.btn:active{transform:translate(3px,3px);box-shadow:inset -2px -2px 0 rgba(255,236,200,.14),inset 2px 2px 0 rgba(0,0,0,.5),1px 1px 0 rgba(0,0,0,.5)}
.btn .arw{color:var(--amber);font-size:18px}

.title{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
.title b{display:block;font-size:36px;letter-spacing:6px;color:var(--bone);text-shadow:3px 3px 0 rgba(0,0,0,.9)}
.title span{display:block;font-size:12px;letter-spacing:4px;color:var(--amber-dim);margin-top:4px}

.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:2px;color:var(--bone-dark)}
.hdr-right b{color:var(--toxic);font-weight:400;letter-spacing:1px}

.hazard{height:6px;background:repeating-linear-gradient(45deg,var(--amber) 0 8px,#17120e 8px 16px);opacity:.9}

/* ── 地图区 ── */
.map{position:absolute;left:0;right:620px;top:98px;bottom:0;overflow:hidden}
.track{position:absolute;left:0;top:50%;transform:translate(var(--ox,0),-50%);width:2600px;height:520px}

/* 地面带：让整条路线有落脚面 */
.ground{position:absolute;left:0;right:0;top:150px;height:260px;
  background:linear-gradient(180deg,rgba(58,43,30,0) 0%,rgba(58,43,30,.55) 18%,rgba(42,31,24,.75) 50%,rgba(58,43,30,.55) 82%,rgba(58,43,30,0) 100%);
  border-top:2px solid rgba(240,160,80,.10);border-bottom:2px solid rgba(240,160,80,.10)}
.ground::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,transparent 3px 11px);opacity:.35}

/* ── 地图道具（占位美术）── */
.prop{position:absolute;pointer-events:none}
.prop.car{width:86px;height:34px;background:#241a15;border:3px solid #0b0908;
  box-shadow:inset 0 5px 0 rgba(255,236,200,.07),4px 4px 0 rgba(0,0,0,.4)}
.prop.car::before{content:'';position:absolute;left:14px;top:-14px;width:46px;height:14px;
  background:#2b2320;border:3px solid #0b0908;border-bottom:0}
.prop.car::after{content:'';position:absolute;left:8px;bottom:-8px;width:14px;height:10px;
  background:#151110;box-shadow:52px 0 0 #151110}
.prop.barrier{width:58px;height:22px;
  background:repeating-linear-gradient(45deg,#c04a38 0 7px,#17120e 7px 14px);
  border:3px solid #0b0908;transform:skewX(-6deg);opacity:.8}
.prop.lamp{width:5px;height:74px;background:#3f342c;border-left:2px solid #0b0908}
.prop.lamp::after{content:'';position:absolute;left:-9px;top:-10px;width:20px;height:12px;
  background:#f0a050;box-shadow:0 0 18px 6px rgba(240,160,80,.30);border:2px solid #0b0908}
.prop.crate{width:30px;height:26px;background:#3a2b1e;border:3px solid #0b0908;
  box-shadow:inset 0 3px 0 rgba(255,236,200,.10)}
.prop.crate::after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.5)}

/* 道路 */

.road{position:absolute;height:14px;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 6px,rgba(0,0,0,0) 6px 22px),
  linear-gradient(180deg,#5a4230,#3a2b1e 60%,#241a12);
  box-shadow:0 6px 0 rgba(0,0,0,.35);transform-origin:0 50%;border-top:2px solid rgba(255,236,200,.08)}
.road::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(240,160,80,.22) 0 2px,transparent 2px 26px);opacity:.5}

/* 节点 */
.node{position:absolute;width:220px;height:200px;transform:translate(-50%,-50%);cursor:pointer}
.node .plate{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,37,31,.97),rgba(30,24,20,.97));border:4px solid var(--ink);
  box-shadow:inset 0 4px 0 rgba(255,236,200,.10),inset 4px 0 0 rgba(255,236,200,.04),
             inset 0 -4px 0 rgba(0,0,0,.55),inset -4px 0 0 rgba(0,0,0,.32),
             8px 8px 0 rgba(0,0,0,.45)}
.node .thumb{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:96px;height:96px;
  background:var(--steel-1) center/cover no-repeat;border:2px solid #000;image-rendering:pixelated}
.node .name{position:absolute;left:0;right:0;top:132px;text-align:center;font-size:20px;letter-spacing:1px;color:var(--bone)}
.node .stars{position:absolute;left:0;right:0;top:160px;text-align:center;font-size:18px;color:var(--amber)}
.node .idx{position:absolute;left:8px;top:6px;font-size:12px;letter-spacing:1px;color:var(--steel-5)}
.node .rivet{position:absolute;width:10px;height:10px;background:var(--steel-5);border:2px solid var(--ink);
  box-shadow:inset 2px 2px 0 rgba(255,240,210,.3)}
.node .rivet.a{left:6px;top:6px}.node .rivet.b{right:6px;bottom:6px}
.node .thumb.none,.d-thumb.none{display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,rgba(192,74,56,.07) 0 8px,rgba(0,0,0,0) 8px 16px),#14100d;
  border:2px dashed rgba(192,74,56,.45)}
.node .thumb.none span{font-size:12px;letter-spacing:1px;color:#8a6f5c}
.d-thumb.none span{font-size:16px;letter-spacing:3px;color:#8a6f5c}

.node:hover .plate{box-shadow:inset 0 4px 0 rgba(255,236,200,.16),inset 0 -4px 0 rgba(0,0,0,.55),8px 8px 0 rgba(0,0,0,.45),0 0 0 2px var(--amber-dim)}
.node:hover .name{color:#fff}

/* 选中 */
.node.sel .plate{border-color:var(--toxic-dim);
  box-shadow:inset 0 4px 0 rgba(168,238,84,.22),inset 0 -4px 0 rgba(0,0,0,.5),8px 8px 0 rgba(0,0,0,.45),0 0 0 4px rgba(168,238,84,.35)}
.node.sel .name{color:var(--toxic)}
.node.sel::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:300px;height:280px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(168,238,84,.18) 0%,rgba(168,238,84,.06) 45%,transparent 72%);
  pointer-events:none}
.node.sel::after{content:"";position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
  width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:11px solid var(--toxic);filter:drop-shadow(0 0 6px rgba(168,238,84,.6))}

/* 锁定 */
.node.locked{cursor:not-allowed}
.node.locked .plate{background:rgba(18,15,13,.96);border-color:#161210}
.node.locked .thumb{filter:grayscale(1) brightness(.45)}
.node.locked .name{color:var(--bone-dark)}
.node.locked .stars{color:#4a3f34}
.node.locked .lock{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:44px;height:44px;
  background:var(--blood);border:3px solid #000;border-radius:2px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.node.locked .lock::before{content:"";position:absolute;left:50%;top:-16px;transform:translateX(-50%);
  width:24px;height:18px;border:4px solid var(--blood);border-bottom:0;border-radius:12px 12px 0 0}

/* ── 右侧详情（非模态） ── */
.detail{position:absolute;right:0;top:98px;bottom:0;width:620px;
  background:url("../Assets/Prefabs/UI/UIPhoto/Paper.png") center/100% 100% no-repeat;
  background-color:rgba(22,17,14,.97);
  border-left:4px solid var(--ink);
  box-shadow:inset 0 0 0 2px rgba(255,236,200,.06),-14px 0 34px rgba(0,0,0,.55);
  padding:26px 30px;display:flex;flex-direction:column}
.detail::before{content:"";position:absolute;inset:0;background:rgba(24,19,16,.86);pointer-events:none}
.detail>*{position:relative}

.d-close{position:absolute;right:18px;top:16px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  font-size:34px;color:var(--blood);background:var(--steel-2);border:4px solid var(--ink);cursor:pointer;
  box-shadow:inset 2px 2px 0 rgba(255,236,200,.12),inset -2px -2px 0 rgba(0,0,0,.55),4px 4px 0 rgba(0,0,0,.45)}
.d-close:hover{background:var(--steel-3);color:#fff}

.d-thumb{height:250px;background:var(--steel-1) center/cover no-repeat;border:4px solid var(--ink);
  box-shadow:inset 0 0 0 2px rgba(255,236,200,.06),6px 6px 0 rgba(0,0,0,.45);image-rendering:pixelated;margin-bottom:20px}

.d-name{font-size:40px;letter-spacing:4px;color:var(--bone);text-shadow:3px 3px 0 rgba(0,0,0,.9);line-height:1.1}
.d-diff{margin-top:10px;font-size:20px;letter-spacing:2px;color:var(--amber)}
.d-desc{margin-top:18px;font-size:20px;line-height:1.85;letter-spacing:1px;color:var(--bone-dim)}
.d-meta{margin-top:auto;font-size:14px;letter-spacing:2px;color:var(--bone-dark);line-height:2}
.d-meta b{color:var(--bone-dim);font-weight:400}

.d-enter{margin-top:18px;height:80px;display:flex;align-items:center;justify-content:center;
  font-size:26px;letter-spacing:4px;color:var(--bone);cursor:pointer;
  background:var(--steel-2);border:4px solid var(--ink);
  box-shadow:inset 2px 2px 0 rgba(255,236,200,.14),inset -2px -2px 0 rgba(0,0,0,.55),4px 4px 0 rgba(0,0,0,.45)}
.d-enter:hover{background:var(--steel-3);color:#fff;box-shadow:inset 2px 2px 0 rgba(255,236,200,.14),inset -2px -2px 0 rgba(0,0,0,.55),4px 4px 0 rgba(0,0,0,.45),0 0 0 2px var(--amber-dim)}

/* ── 覆盖层 ── */
.ov{position:absolute;inset:0;pointer-events:none;z-index:40}
.ov.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 2px,rgba(0,0,0,0) 2px 4px);opacity:.16}
.ov.vig{opacity:.72;background:radial-gradient(ellipse 84% 78% at 50% 46%,rgba(0,0,0,0) 50%,rgba(0,0,0,.34) 100%),
  linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 14%,rgba(0,0,0,0) 86%,rgba(0,0,0,.25))}
.ov.glass{background:linear-gradient(118deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.015) 22%,rgba(255,255,255,0) 42%)}

/* 滚动提示 */
.hint{position:absolute;left:40px;bottom:22px;font-size:12px;letter-spacing:2px;color:var(--bone-dark);display:flex;gap:16px}
.hint b{color:var(--steel-5);font-weight:400}

#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:Consolas,monospace;font-size:12px;color:#6d6050;background:rgba(8,6,5,.96)}
#bar b{color:#F0A050;font-weight:400}
</style>
</head>
